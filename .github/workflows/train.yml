name: Model Training

on:
  schedule:
    - cron: '0 16 * * *' # 日本時間 毎日 01:00
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write # モデルファイルをコミットするための権限
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pyjpboatrace lightgbm pandas scikit-learn requests
          
      - name: Run training
        run: |
          python optimize.py  # 学習用スクリプト
          
      - name: Commit and push model
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update model file"
          file_pattern: "model.txt"

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "🌙 **【モデル自動学習完了】** 夜中のトレーニングとモデルファイルの更新が正常に完了しました！"}' \
               $DISCORD_WEBHOOK_URL
