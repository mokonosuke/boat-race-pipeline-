name: Model Training

on:
  schedule:
    - cron: '0 16 * * *'  # 日本時間 毎日 01:00
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write # モデルファイルをコミットするための権限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 履歴をすべて取得してリモートとのズレを防ぐ

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyjpboatrace lightgbm pandas scikit-learn requests

      - name: Run training
        run: |
          python optimize.py

      - name: Commit and push model and dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.txt dataset.csv
          git commit -m "Auto-update model and dataset [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "🌙 **【モデル自動更新完了】** 夜中のトレーニングとモデルファイルの更新が正常に完了しました！✨"}' \
               $DISCORD_WEBHOOK_URL
