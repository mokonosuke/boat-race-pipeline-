name: Morning Silent Predict

on:
  schedule:
    # 毎日朝8:00 (JST 8:00 = UTC 23:00 ※前日) に実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動でも実行できるようにする

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run silent prediction for all races
        env:
          # DiscordのWebhook URLはあえて設定しない（または空にする）ことで通知を完全に防ぎます
          BROAT_RACE_ENV: "production"
        run: |
          python predict_today.py
