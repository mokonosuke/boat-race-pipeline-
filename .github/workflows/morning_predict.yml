name: Morning Silent Predict

on:
  schedule:
    # 毎日朝8:00 (JST 8:00 = UTC 23:00 ※前日) に実行
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction for all races (Silent)
        env:
          BOAT_RACE_ENV: "production"
          SILENT_MODE: "true"
        run: |
          python predict_today.py

      - name: Notify completion to Discord
        # 予測が成功した時だけ、完了通知を1回だけ送る
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "☀️ 本日の全会場・全レースのAI予測データ作成が完了しました！"}' \
          $DISCORD_WEBHOOK_URL
