name: Nightly Summary and Train

on:
  schedule:
    # 毎日 22:00 JST (世界時 13:00) に実行
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  nightly-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 履歴ファイルをコミットするための権限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 履歴をすべて取得してズレを防ぐ

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nightly Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python nightly_pipeline.py

      - name: Commit and push history data
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update history data [skip ci]"
          file_pattern: 'history_data.csv'
