name: Nightly Summary and Train

on:
  schedule:
    # 毎日 22:00 JST (世界時 13:00) に実行
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  nightly-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 履歴ファイルをコミットするための権限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 履歴をすべて取得してズレを防ぐ

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nightly Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python nightly_pipeline.py

      - name: Commit and push history data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add history_data.csv
          git commit -m "Auto-update history data [skip ci]" || exit 0
          git push
