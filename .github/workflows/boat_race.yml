name: Boat Race Automation

on:
  schedule:
    - cron: '0 12 * * *' # 毎日定期実行
  workflow_dispatch: # 手動実行

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gitへの書き込み権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4

      - name: Run main script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          
          # 変更がある場合のみステージング・コミット・プッシュする
          git add data/ || true
          git diff --staged --quiet || git commit -m "Auto-update boat race data"
          git push || echo "No changes to push"
