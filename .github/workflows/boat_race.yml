name: Boat Race Prediction

on:
  schedule:
    - cron: '0 0,6 * * *' # 毎日 9:00 と 15:00 (JST) の自動実行
  workflow_dispatch:
    inputs:
      stadium:
        description: '開催場コード (例: 01〜24。空欄なら全場)'
        required: false
        default: ''
      race_no:
        description: 'レース番号 (例: 11。空欄なら全レース)'
        required: false
        default: ''

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run prediction script
        env:
          INPUT_STADIUM: ${{ github.event.inputs.stadium }}
          INPUT_RACE_NO: ${{ github.event.inputs.race_no }}
        run: |
          python predict_today.py
