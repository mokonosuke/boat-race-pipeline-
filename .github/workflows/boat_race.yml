name: Run Boat Race Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 毎日UTC 0:00（日本時間 朝9:00）に自動実行

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyjpboatrace requests lightgbm scikit-learn pandas numpy

      - name: Run Python script
        run: python -u optimize.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
