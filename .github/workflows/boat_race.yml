name: Boat Race Auto Prediction (SG/G1/Women)

on:
  schedule:
    - cron: '0 0,5 * * *' # 日本時間 09:00 と 14:00 に定期実行
  workflow_dispatch:
    inputs:
      stadium:
        description: '会場名 (空欄またはAUTOで自動判定)'
        required: false
        default: 'AUTO'
      race_no:
        description: 'レース番号 (空欄またはAUTOで自動判定)'
        required: false
        default: 'AUTO'

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pyjpboatrace lightgbm pandas scikit-learn requests
          
      - name: Run prediction
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_STADIUM: ${{ github.event.inputs.stadium || 'AUTO' }}
          INPUT_RACE_NO: ${{ github.event.inputs.race_no || 'AUTO' }}
        run: |
          python predict.py
