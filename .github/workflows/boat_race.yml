name: Boat Race Prediction Pipeline

on:
  schedule:
    - cron: '30 1 * * *'  # 毎日日本時間の午前10:30に自動実行
  workflow_dispatch:
    inputs:
      stadium:
        description: '会場名 (例: びわこ, 戸田, 11)'
        required: true
        default: 'びわこ'
        type: string
      race_no:
        description: 'レース番号 (1〜12)'
        required: true
        default: '1'
        type: string

jobs:
  prediction:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install pandas lightgbm scikit-learn requests pyjpboatrace

      - name: 1. モデルの学習と最適化 (optimize.pyの実行)
        run: python optimize.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 2. 本日の予測とDiscord通知 (predict_today.pyの実行)
        run: python predict_today.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_STADIUM: ${{ github.event.inputs.stadium }}
          INPUT_RACE_NO: ${{ github.event.inputs.race_no }}
